name: Preview (GitHub Pages)

# 新HPの「プレビュー専用」。github.io の別URLに配信します。
# 本番（naganawa-k.co.jp / CANONET FTP）とは完全に別で、影響しません。
# main に push すると自動でプレビューが更新されます。
#
# 【microCMS 連携方式：クライアント取得 + キーのビルド時注入】
#   - お知らせはブラウザ側（js/microcms.js）で microCMS から取得して表示します。
#   - APIキーの実値はリポジトリにコミットしません。リポジトリの
#     js/microcms.js にはプレースホルダー __MICROCMS_API_KEY__ を置き、
#     このワークフローが Secrets(MICROCMS_API_KEY) の値を、公開用にコピーした
#     _site/js/microcms.js にのみ差し込みます（scripts/inject-microcms-key.mjs）。
#   - 公開前に microCMS へ実際に GET して 200 を確認し、401 等なら
#     デプロイを中止します（公開中サイトは無傷）。
#   - サービスドメイン(naganawa-k)は公開情報のため js/microcms.js に直書きです。

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [microcms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify microCMS API key (fail fast on 401)
        # Secrets のキーで実際に GET し、200 以外ならデプロイを止める。
        # 公開ファイルには一切依存せず、Secrets のみで検証する。
        # キー値はログに出さず、HTTPステータスのみ表示する。
        # サービスドメインは Secret MICROCMS_SERVICE_ID を使用（未設定時は公開情報 naganawa-k）。
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
        run: |
          if [ -z "$MICROCMS_API_KEY" ]; then
            echo "::error::Secret MICROCMS_API_KEY が未設定です。Settings→Secrets を確認してください。"
            exit 1
          fi
          SERVICE_ID="${MICROCMS_SERVICE_ID:-naganawa-k}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-MICROCMS-API-KEY: $MICROCMS_API_KEY" \
            "https://${SERVICE_ID}.microcms.io/api/v1/news?limit=1")
          echo "microCMS /news HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::microCMS 認証チェック失敗 (HTTP $code)。キー無効/GET権限不足/Secret名相違の可能性。"
            exit 1
          fi
          echo "microCMS auth OK (200)."

      - name: Prepare preview (exclude tooling files)
        run: |
          mkdir -p _site
          # リポジトリ直下をコピー（.git / .github / ビルド用ファイルは除外）
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='scripts' --exclude='templates' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='node_modules' \
            ./ _site/
          # 検索避け（プレビューがインデックスされないように）
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Inject microCMS API key into published JS
        # 公開用 _site/js/microcms.js のプレースホルダーにのみキーを注入。
        # リポジトリ本体の js/microcms.js はプレースホルダーのまま。
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: node scripts/inject-microcms-key.mjs

      - name: Verify _site has NO placeholder (local, pre-upload)
        # アップロード前に、公開対象ファイルへ確実に注入されたか grep で検証。
        # 残っていればデプロイを失敗させる（アップロードしない）。
        run: |
          if grep -q "__MICROCMS_API_KEY__" _site/js/microcms.js; then
            echo "::error::_site/js/microcms.js にプレースホルダーが残存。アップロードを中止します。"
            exit 1
          fi
          echo "_site/js/microcms.js: プレースホルダー無し（注入OK）。"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
      # ※ デプロイ後に「公開ファイルから API_KEY を再抽出して検証」する処理は撤去しました。
      #   GitHub Pages のCDN反映遅延/キャッシュで抽出に失敗し、デプロイ成功後にジョブが
      #   赤くなる不安定要因だったためです。正しさは以下の“公開ファイルに依存しない”
      #   デプロイ前検証で担保しています：
      #     1) Secrets のキーで microCMS へ実GET → 200 を確認（Verify microCMS API key）
      #     2) _site/js/microcms.js にプレースホルダーが残っていないか grep（Verify _site …）
